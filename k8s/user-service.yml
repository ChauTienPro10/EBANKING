apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  type: NodePort
  ports:
    - name: http
      port: 8001        # port bên trong cluster
      targetPort: 8001     # port trong container
      nodePort: 30081      # port để truy cập từ bên ngoài (phải trong khoảng 30000–32767)
    - name: grpc
      port: 9001
      targetPort: 9001
      nodePort: 30091
