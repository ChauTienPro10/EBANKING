apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  labels:
    app: email-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
        - name: email-service
          image: tien22012003/emailservice:1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8002   
            - containerPort: 9002
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: 192.168.1.3:29092
            - name: MACHINE_HOST
              value: 192.168.1.3
