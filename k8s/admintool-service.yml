apiVersion: v1
kind: Service
metadata:
  name: admintool-service
  labels:
    app: admintool-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app: admintool-service

---
# Optional: NodePort service for external access during development
apiVersion: v1
kind: Service
metadata:
  name: admintool-service-nodeport
  labels:
    app: admintool-service
spec:
  type: NodePort
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081  # External access port
      protocol: TCP
  selector:
    app: admintool-service