apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  type: NodePort
  ports:
    - name: http
      port: 8000           # port bên trong cluster
      targetPort: 8000     # port trong container
      nodePort: 30080      # port để truy cập từ bên ngoài (phải trong khoảng 30000–32767)
    - name: grpc
      port: 9000
      targetPort: 9000
      nodePort: 30090
