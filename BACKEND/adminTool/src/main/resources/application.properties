# Application
spring.application.name=adminTool
server.port=7999
machine.host=localhost

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://${machine.host}:3306/DB_ADMIN?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret.key=chauduongphattien2201gmailcomsupersecretchauduongphattien2201gmailcomsupersecretchauduongphattien2201gmailcomsupersecretchauduongphattien2201gmailcomsupersecretchauduongphattien2201gmailcomsupersecretchauduongphattien2201gmailcomsupersecret1234567890123456

# FIXED: Removed duplicate jwt.expiration.hours=8 (was not used)
# Access token expiration (minutes)
jwt.expiration.minutes=30

# JWT Refresh Token expiration (days)
jwt.refresh.days=7

# gRPC Service Endpoints
grpc.user.service.host=${USER_SERVICE:localhost}
grpc.user.service.port=${USER_SERVICE_PORT:9001}
grpc.transaction.service.host=${TRANSACTION_SERVICE:localhost}
grpc.transaction.service.port=${TRANSACTION_SERVICE_PORT:9003}
logging.level.org.springframework.security=DEBUG



# Rate Limiting Configuration
# FIXED: Moved from hardcoded values in LoginRateLimiterService
rate.limiter.max.attempts=5
rate.limiter.window.minutes=10
rate.limiter.lock.minutes=10

# Logging
logging.level.com.ebanking.adminTool=DEBUG
logging.level.io.grpc=INFO

# Application Info
app.version=1.0.0


firebase.service.url=http://${machine.host}:8004/



# ===== List external DBs =====
external-dbs.names=DB_USER_SERVICE,DB_TRANSACTION_SERVICE,DB_FCM_SERVICE,DB_AUTH

# ===== USER SERVICE DB =====
external-dbs.DB_USER_SERVICE.url=jdbc:mysql://${machine.host}:3306/DB_USER_SERVICE
external-dbs.DB_USER_SERVICE.username=root
external-dbs.DB_USER_SERVICE.password=root@123
external-dbs.DB_USER_SERVICE.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== TRANSACTION SERVICE DB =====
external-dbs.DB_TRANSACTION_SERVICE.url=jdbc:mysql://${machine.host}:3306/DB_TRANSACTION_SERVICE
external-dbs.DB_TRANSACTION_SERVICE.username=root
external-dbs.DB_TRANSACTION_SERVICE.password=root@123
external-dbs.DB_TRANSACTION_SERVICE.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== FCM SERVICE DB =====
external-dbs.DB_FCM_SERVICE.url=jdbc:mysql://${machine.host}:3306/DB_FCM_SERVICE
external-dbs.DB_FCM_SERVICE.username=root
external-dbs.DB_FCM_SERVICE.password=root@123
external-dbs.DB_FCM_SERVICE.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== AUTH
external-dbs.DB_AUTH.url=jdbc:mysql://${machine.host}:3306/DB_AUTH
external-dbs.DB_AUTH.username=root
external-dbs.DB_AUTH.password=root@123
external-dbs.DB_AUTH.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Safe default =====
external-dbs.hikari.maximum-pool-size=2
external-dbs.hikari.connection-timeout=3000
