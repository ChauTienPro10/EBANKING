spring:
  application:
    name: adminTool
  
  # Production Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/ebanking_prod?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: HikariPool-AdminTool-Prod
      auto-commit: true
      leak-detection-threshold: 60000
  
  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate  # NEVER use 'update' in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  # Security Configuration
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD}
  
  # Flyway Configuration (Database Migration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

# Server Configuration
server:
  port: 8081
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# JWT Configuration
jwt:
  secret:
    key: ${JWT_SECRET}
  expiration:
    minutes: 60
  refresh:
    days: 30

# gRPC Service Endpoints
grpc:
  user:
    service:
      host: ${USER_SERVICE:user-service}
      port: ${USER_SERVICE_PORT:9001}
  transaction:
    service:
      host: ${TRANSACTION_SERVICE:transaction-service}
      port: ${TRANSACTION_SERVICE_PORT:9003}

# Rate Limiting Configuration
rate:
  limiter:
    max:
      attempts: 3
    window:
      minutes: 15
    lock:
      minutes: 30

# Logging Configuration
logging:
  level:
    root: WARN
    com.ebanking.admintool: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    io.grpc: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/admintool/admintool-prod.log
    max-size: 50MB
    max-history: 30

# Actuator Configuration (Health Check & Monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Application Info
app:
  version: 1.0.0
  environment: production

