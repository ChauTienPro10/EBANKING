spring:
  application:
    name: adminTool
  
  # Development Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3307/DB_ADMIN?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root@123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      pool-name: HikariPool-AdminTool-Dev
      auto-commit: true
  
  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # Removed: dialect - Hibernate auto-detects MySQL
    open-in-view: false  # Tránh lazy loading issues
  
  # Security Configuration
  security:
    user:
      name: admin
      password: admin@123
  
  # Flyway Configuration (Database Migration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Server Configuration
server:
  port: 8081
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret:
    key: ${JWT_SECRET:chauduongphattien2201gmailcomsupersecretchauduongphattien2201gmailcomsupersecretchauduongphattien2201gmailcomsupersecretchauduongphattien2201gmailcomsupersecretchauduongphattien2201gmailcomsupersecretchauduongphattien2201gmailcomsupersecret1234567890123456}
  expiration:
    minutes: 30
  refresh:
    days: 7

# gRPC Service Endpoints
grpc:
  user:
    service:
      host: ${USER_SERVICE:localhost}
      port: ${USER_SERVICE_PORT:9001}
  transaction:
    service:
      host: ${TRANSACTION_SERVICE:localhost}
      port: ${TRANSACTION_SERVICE_PORT:9003}

# Rate Limiting Configuration
rate:
  limiter:
    max:
      attempts: 5
    window:
      minutes: 10
    lock:
      minutes: 10

# Logging Configuration
logging:
  level:
    root: INFO
    com.ebanking.admintool: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    io.grpc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/admintool-dev.log
    max-size: 10MB
    max-history: 10

# Actuator Configuration (Health Check & Monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Application Info
app:
  version: 1.0.0
  environment: development

