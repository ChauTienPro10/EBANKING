spring:
  application:
    name: adminTool
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Default Database Configuration (overridden by profiles)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA / Hibernate Default Configuration
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration

# Server Configuration
server:
  port: 8081
  servlet:
    context-path: /api

# JWT Configuration (Base)
jwt:
  refresh:
    days: 7

# Logging Configuration (Base)
logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator Configuration (Base)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# Application Info
app:
  version: 1.0.0

# Firebase Service Configuration
firebase:
  service:
    url: ${FIREBASE_SERVICE_URL:http://localhost:8083/notify}

