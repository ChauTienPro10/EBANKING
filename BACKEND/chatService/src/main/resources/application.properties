# Server Configuration
server.port=8086
spring.application.name=chatService
machine.host=127.0.0.1

# Database Configuration
spring.datasource.url=jdbc:mysql://${machine.host}:3306/DB_CHAT?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Kafka Configuration
# Use localhost:29092 for local development (PLAINTEXT_HOST listener)
# This avoids hostname resolution issues with 'kafka' hostname
spring.kafka.bootstrap-servers=${machine.host}:29092
spring.kafka.consumer.group-id=chat-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# WebSocket Configuration
websocket.allowed-origins=http://localhost:3000,http://localhost:19006

# Logging
logging.level.com.ebanking.chatService=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
