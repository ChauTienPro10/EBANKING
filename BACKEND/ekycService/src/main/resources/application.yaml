#spring.application.name=ekycService
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ekyc_db
    username: postgres
    password: root123456
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
server:
  port: 8081

# FPT.AI Configuration
fpt:
  ai:
    api-key: juexeQ3Q2nVoK59t6SCmp1J5ioXe3GTY
    ocr-url: https://api.fpt.ai/vision/idr/vnm/
    liveness-url: https://api.fpt.ai/dmp/liveness/v3
    face-match-url: https://api.fpt.ai/dmp/checkface/v1

# CORS
cors:
  allowed-origins: http://localhost:3000,http://localhost:19006

# File Upload & Storage Configuration
app:
  base-url: http://localhost:8081    # Base URL cho webhook callback (thay đổi khi deploy)
  upload:
    base-dir: ./uploads              # Thư mục lưu file (relative hoặc absolute path)
    max-file-size-mb: 10             # Giới hạn kích thước file (MB)

  # Session expiry for cleanup
  session:
    expiry-minutes: 10               # Session hết hạn sau 10 phút
    cleanup-enabled: true            # Tự động xóa file của session hết hạn
