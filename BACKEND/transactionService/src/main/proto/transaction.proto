syntax = "proto3";

option java_package = "com.ebanking.transactionService.grpc";
option java_outer_classname = "TransactionProto";


message TransferRequest {
    string senderAccountNumber = 1;
    string receiverAccountNumber = 2;
    string amount = 3;
    string currency = 4;
    string transactionType = 5;
    string description = 6;
    string username = 7;
    bool requiresFaceAuth = 8;
    string faceAuthSessionId = 9;
    string categoryId = 10; // Spending category reference
}

message TransHistoryRequest {
  int32 page = 1;
  int32 limit = 2;
  string username = 3;
  string sender = 4;
  string fromDate = 5;
  string toDate = 6;
}

message TransferResponse {
  int64 transactionId = 1;
  string senderAccountNumber = 2;
  string receiverAccountNumber = 3;
  string amount = 4;
  string currency = 5;
  string transactionType = 6;
  string description = 7;
  string status = 8;
  string transactionAt = 9;
}
message TransactionList {
  repeated TransferResponse transactions = 1;
}

service TransactionService {
  rpc transfer(TransferRequest) returns (TransferResponse);
  rpc history(TransHistoryRequest) returns(TransactionList);
}