spring.application.name=transactionService
server.port=8003
grpc.server.port=9003
grpc.client.local-grpc-server.address=static://localhost:9003
grpc.server.enabled=true
logging.level.net.devh.boot.grpc.server=TRACE
logging.level.net.devh.boot.grpc.client=TRACE
logging.level.io.grpc=TRACE
logging.level.net.devh=DEBUG

spring.datasource.url=jdbc:mysql://34.124.233.161:3306/DB_TRANSACTION_SERVICE?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#machine.host=192.168.0.129
machine.host=localhost
spring.kafka.bootstrap-servers=${machine.host}:29092
# ========== PRODUCER ==========
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# ========== CONSUMER ==========
spring.kafka.consumer.group-id=transaction-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.ebanking.transactionService.entity.Transaction
spring.kafka.consumer.properties.spring.json.trusted.packages=*
