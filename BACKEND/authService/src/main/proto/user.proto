syntax = "proto3";

option java_package = "com.example.auth.protopkg";
option java_outer_classname = "UserProto";

message User {
  int64 id = 1;
  string fullName = 2;
  string username = 3;
  string address = 4;
  string citizenId = 5;
  string birthday = 6;
  bool isMale = 7;
  string createAt = 8;
  repeated string roles = 9;
}

message GetUserRequestById {
  int64 userId = 1;
}

message UserResponse {
  User user = 1;
}

message NewUserRequest {
  string username = 1;
  string password = 2;
  string citizenId = 3;
  string typeVerify = 4;
}

message NewUserResponse {
  User user = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  string jwt = 2;
}

message CheckUserExistRequest {
  string username = 1;
}

message CheckUserExistResponse {
  bool isExist = 1;
}

message NewUserGenOtpResponse {
  bool success = 1;
  string message = 2;
}

message verifyOtpRegisterRequest {
  string username = 1;
  string otpValue = 2;
}

message changePasswordRequest {
  string username = 1;
  string oldPass = 2;
  string password = 3;
}

message changePasswordResponse {
  bool status = 1;
  string description = 2;
}
service UserService {
  rpc getUserById(GetUserRequestById) returns (UserResponse);
  rpc newUser(NewUserRequest) returns (NewUserResponse);
  rpc newUserGenOtp(NewUserRequest) returns (NewUserGenOtpResponse);
  rpc login(LoginRequest) returns (LoginResponse);
  rpc CheckUserExist(CheckUserExistRequest) returns (CheckUserExistResponse);
  rpc verifyOtpRegister(verifyOtpRegisterRequest) returns (NewUserResponse);
  rpc changePassword(changePasswordRequest) returns (changePasswordResponse);
}