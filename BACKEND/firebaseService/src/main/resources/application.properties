spring.application.name=firebaseService
server.port=8004
grpc.server.port=9004

# mysql - Firebase Service Database
spring.datasource.url=jdbc:mysql://localhost:3307/DTB_EBANKING?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
machine.host=localhost
spring.kafka.bootstrap-servers=${machine.host}:9092

# ========== PRODUCER ==========
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ========== CONSUMER ==========
spring.kafka.consumer.group-id=firebase-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=com.ebanking.transactionService.entity.Transaction:com.ebanking.firebaseService.dto.TransactionEvent

# User Service Configuration
user.service.host=localhost
user.service.port=9001