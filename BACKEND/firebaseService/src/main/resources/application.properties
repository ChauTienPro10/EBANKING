spring.application.name=firebaseService
server.port=8004
grpc.server.port=9004

# mysql - Firebase Service Database
spring.datasource.url=jdbc:mysql://localhost:3307/DB_FCM_SERVICE?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
machine.host=localhost
spring.kafka.bootstrap-servers=${machine.host}:29092

# Kafka Consumer config
spring.kafka.consumer.group-id=firebase-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.ebanking.transactionService.entity.Transaction:com.ebanking.firebaseService.dto.Transaction

spring.kafka.consumer.properties.spring.json.trusted.packages=*


# User Service Configuration
user.service.host=localhost
user.service.port=9001
user.service.rest.port=8001

# Transaction Service Configuration
transaction.service.host=localhost
transaction.service.port=8002

